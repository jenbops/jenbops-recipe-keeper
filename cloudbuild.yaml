steps:
  # 1. Start a throwaway Postgres on Cloud Build's shared network
  - id: start-db
    name: gcr.io/cloud-builders/docker
    args: ["run", "-d", "--name", "testdb", "--network", "cloudbuild",
           "-e", "POSTGRES_PASSWORD=ci-only-password", "postgres:17-alpine"]

  # 2. Build the test image (the "test" stage of our Dockerfile)
  - id: build-test
    name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "test", "-t", "recipe-test", "."]

  # 3. Wait for the database, then run the tests against it
  - id: run-tests
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for i in $(seq 1 30); do docker exec testdb pg_isready -U postgres && break; sleep 2; done
        docker run --rm --network cloudbuild \
          -e TEST_DATABASE_ADMIN_URL=postgresql://postgres:ci-only-password@testdb:5432/postgres \
          recipe-test

options:
  logging: CLOUD_LOGGING_ONLY