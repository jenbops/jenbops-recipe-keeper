<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body>
  <h1>Recipe Keeper</h1>
  <nav class="main">
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Recipes</a>
    <a href="/shopping" {% if request.url.path == '/shopping' %}aria-current="page"{% endif %}>Shopping list</a>
  </nav>
  {% block content %}{% endblock %}
    <form method="post" action="/theme" class="theme-picker">
    <input type="hidden" name="next" value="{{ request.url.path }}">
    <label for="theme">Theme</label>
    <select id="theme" name="theme" onchange="this.form.submit()">
      {% for key, name in themes.items() %}
      <option value="{{ key }}"{% if key == theme %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit" class="btn">Apply</button></noscript>
  </form>
</body>
</html>
