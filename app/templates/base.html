<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Keeper</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    h1 a { color: inherit; text-decoration: none; }
    input[type=search] { width: 100%; padding: .75rem; font-size: 1rem; box-sizing: border-box; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
    .chip input { position: absolute; opacity: 0; }
    .chip span { display: inline-block; padding: .4rem .8rem; border: 1px solid #888; border-radius: 999px; cursor: pointer; }
    .chip input:checked + span { background: #2563eb; border-color: #2563eb; color: #fff; }
    .list { list-style: none; padding: 0; }
    .list a { display: block; padding: .9rem 0; border-bottom: 1px solid #8884; text-decoration: none; color: inherit; }
    .tags em { font-size: .8rem; margin-right: .4rem; padding: .1rem .5rem; border: 1px solid #8886; border-radius: 999px; font-style: normal; }
    .text { white-space: pre-wrap; }
    .empty { opacity: .7; }
        label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    form input[type=text], textarea { width: 100%; padding: .75rem; font-size: 1rem; box-sizing: border-box; font-family: inherit; }
    .btn { display: inline-block; padding: .7rem 1.1rem; border: 1px solid #888; border-radius: .5rem; background: none; color: inherit; font-size: 1rem; text-decoration: none; cursor: pointer; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.danger { border-color: #dc2626; color: #dc2626; }
    .actions { display: flex; gap: .75rem; margin-top: 2rem; }
    .hint { font-size: .85rem; opacity: .7; }
  </style>
</head>
<body>
  <h1><a href="/">🍲 Recipe Keeper</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
